services:
  grok_doc.api_client:
    class: Drupal\grok_doc\Service\XaiCollectionsClient
    arguments: ['@http_client', '@string_translation', '@config.factory']

  grok_doc.manager:
    class: Drupal\grok_doc\Service\CollectionDocumentManager
    arguments: ['@entity_type.manager', '@key.repository', '@queue', '@file_system', '@grok_doc.api_client', '@logger.channel.grok_doc', '@config.factory']

  grok_doc.queue_processor:
    class: Drupal\grok_doc\Service\IngestionQueueProcessor
    arguments: ['@queue', '@grok_doc.manager']

  logger.channel.grok_doc:
    parent: logger.channel_base
    arguments: ['grok_doc']
