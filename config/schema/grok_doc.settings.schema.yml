grok_doc.settings:
  type: config_object
  label: 'Grok Collections settings'
  mapping:
    default_management_key:
      type: string
      label: 'Default Management API Key entity ID'
    api_connect_timeout:
      type: integer
      label: 'xAI API connection timeout'
    api_timeout:
      type: integer
      label: 'xAI API request timeout'
    upload_timeout:
      type: integer
      label: 'xAI document upload timeout'
    max_file_bytes:
      type: integer
      label: 'Maximum file size'
    max_batch_bytes:
      type: integer
      label: 'Maximum batch size'
    max_attempts:
      type: integer
      label: 'Maximum upload attempts'
    queue_batch_size:
      type: integer
      label: 'Queue items processed per manual run'
