entity.grok_doc_collection.collection:
  path: '/admin/config/ai/grok/documents/collections'
  defaults:
    _entity_list: 'grok_doc_collection'
    _title: 'Grok collections'
  requirements:
    _permission: 'view grok collection status'

grok_doc.settings:
  path: '/admin/config/ai/grok/documents/settings'
  defaults:
    _form: '\Drupal\grok_doc\Form\GrokDocSettingsForm'
    _title: 'Grok Collections settings'
  requirements:
    _permission: 'administer grok collections'

entity.grok_doc_collection.add_form:
  path: '/admin/config/ai/grok/documents/collections/add'
  defaults:
    _entity_form: 'grok_doc_collection.add'
    _title: 'Add Grok collection'
  requirements:
    _permission: 'administer grok collections'

grok_doc.remote_collections:
  path: '/admin/config/ai/grok/documents/collections/remote'
  defaults:
    _form: '\Drupal\grok_doc\Form\RemoteCollectionsForm'
    _title: 'Remote xAI Collections'
  requirements:
    _permission: 'administer grok collections'

entity.grok_doc_collection.edit_form:
  path: '/admin/config/ai/grok/documents/collections/{grok_doc_collection}'
  defaults:
    _entity_form: 'grok_doc_collection.edit'
    _title: 'Edit Grok collection'
  requirements:
    _permission: 'administer grok collections'

entity.grok_doc_collection.delete_form:
  path: '/admin/config/ai/grok/documents/collections/{grok_doc_collection}/delete'
  defaults:
    _entity_form: 'grok_doc_collection.delete'
    _title: 'Delete Grok collection'
  requirements:
    _permission: 'administer grok collections'

entity.grok_doc_document.collection:
  path: '/admin/config/ai/grok/documents'
  defaults:
    _entity_list: 'grok_doc_document'
    _title: 'Collection documents'
  requirements:
    _permission: 'view grok collection status'

grok_doc.document_add:
  path: '/admin/config/ai/grok/documents/add'
  defaults:
    _form: '\Drupal\grok_doc\Form\AddDocumentForm'
    _title: 'Add Collection document'
  requirements:
    _permission: 'upload grok collection documents'

grok_doc.import:
  path: '/admin/config/ai/grok/documents/import'
  defaults:
    _form: '\Drupal\grok_doc\Form\BulkImportForm'
    _title: 'Import Collection documents'
  requirements:
    _permission: 'upload grok collection documents'

grok_doc.process:
  path: '/admin/config/ai/grok/documents/process'
  defaults:
    _form: '\Drupal\grok_doc\Form\ProcessQueueForm'
    _title: 'Process Collection document queue'
  requirements:
    _permission: 'administer grok collections'
